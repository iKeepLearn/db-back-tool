[package]
name = "backupdbtool"
version = "1.7.2"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
path = "src/main.rs"
name = "backupdbtool"

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
chrono = { version = "0.4.45", features = ["serde"] }
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
config = "0.15.27"
once_cell = "1.21.4"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
glob = "0.3.4"
dirs = "7.0.0"
tabled = "0.22.0"
reqwest = { version = "0.13.5", features = ["json"] }
shellexpand = "3.1.2"
humansize = "2.1.3"
rust-s3 = "0.38.0"
cos-rust-sdk = "0.1.2"
futures = "0.3.34"
aes-gcm = "0.11.1"
rand = "0.10.3"
argon2 = "0.6.0"
serde_yml = "0.0.13"
serde_with =  { version = "3.24.0", features = ["base64"] }
# sevenz-rust2 = "0.18"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 'z'    # Optimize for size
lto = true         # Enable Link Time Optimization
codegen-units = 1  # Optimize across the whole codebase (slower build)
strip = true       # Automatically strip symbols from the binary.
